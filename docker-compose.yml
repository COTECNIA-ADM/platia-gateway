# PLATIA Gateway: 4 contenedores en 2 redes, más la tarea de migraciones.
#
# Arranque:  python scripts/generate_env.py && docker compose up -d --build
# Salud:     http://localhost:8090/health  (o el puerto de HTTP_PORT)
#
# Redes con mínimo privilegio: Nginx solo ve el gateway (edge_net) y los datos solo
# los ve el gateway (data_net). MySQL y Redis no publican puertos.
# llm_net (G5) es la red que comparte con PLATIA: su ai_service llama al gateway por ella
# (http://platia-gateway:8000), sin pasar por Nginx ni salir del servidor.

services:
  mysql:
    image: mysql:8.0
    # Los disparadores de la auditoría (ADR-013) los crea el usuario de la aplicación, sin SUPER
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped
    networks: [data_net]

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    restart: unless-stopped
    networks: [data_net]

  # Aplica las migraciones de Alembic y termina; el gateway espera a que acabe bien
  migrations:
    build: ./gateway
    command: ["alembic", "upgrade", "head"]
    environment: &gateway-env
      GATEWAY_ENV: ${GATEWAY_ENV:-development}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      HEALTH_TIMEOUT_SECONDS: ${HEALTH_TIMEOUT_SECONDS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PROVIDER_CONNECT_TIMEOUT_SECONDS: ${PROVIDER_CONNECT_TIMEOUT_SECONDS:-10}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-300}
      STREAM_MAX_SECONDS: ${STREAM_MAX_SECONDS:-1800}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-10485760}
      ROUTE_MAX_ATTEMPTS: ${ROUTE_MAX_ATTEMPTS:-3}
      ROUTE_RETRY_WINDOW_SECONDS: ${ROUTE_RETRY_WINDOW_SECONDS:-120}
      COOLDOWN_FAILURES: ${COOLDOWN_FAILURES:-3}
      COOLDOWN_WINDOW_SECONDS: ${COOLDOWN_WINDOW_SECONDS:-60}
      COOLDOWN_SECONDS: ${COOLDOWN_SECONDS:-60}
      COOLDOWN_MAX_SECONDS: ${COOLDOWN_MAX_SECONDS:-300}
      AUDIT_SEAL_INTERVAL_SECONDS: ${AUDIT_SEAL_INTERVAL_SECONDS:-10}
      JWT_SECRET: ${JWT_SECRET:-}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      SESSION_IDLE_DAYS: ${SESSION_IDLE_DAYS:-7}
      SESSION_MAX_DAYS: ${SESSION_MAX_DAYS:-30}
      REQUIRE_MFA_FOR_ADMINS: ${REQUIRE_MFA_FOR_ADMINS:-true}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-auto}
      CACHE_MAX_BYTES: ${CACHE_MAX_BYTES:-524288}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      EVENT_DEDUP_SECONDS: ${EVENT_DEDUP_SECONDS:-300}
      WEBHOOK_POLL_SECONDS: ${WEBHOOK_POLL_SECONDS:-2}
      WEBHOOK_TIMEOUT_SECONDS: ${WEBHOOK_TIMEOUT_SECONDS:-10}
      WEBHOOK_MAX_ATTEMPTS: ${WEBHOOK_MAX_ATTEMPTS:-6}
      WEBHOOK_RETENTION_DAYS: ${WEBHOOK_RETENTION_DAYS:-30}
      WEBHOOK_PRIVATE_HOSTS: ${WEBHOOK_PRIVATE_HOSTS:-}
      REALTIME_RECHECK_SECONDS: ${REALTIME_RECHECK_SECONDS:-30}
      AUDIT_PENDING_MAX_SECONDS: ${AUDIT_PENDING_MAX_SECONDS:-2400}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"
    networks: [data_net]

  gateway:
    build: ./gateway
    environment:
      <<: *gateway-env
      # Métricas de los dos procesos de uvicorn sumadas en /metrics (G12); se vacía al arrancar
      PROMETHEUS_MULTIPROC_DIR: /tmp/metrics
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s
    mem_limit: 512m
    restart: unless-stopped
    networks:
      edge_net:
      data_net:
      llm_net:
        aliases: [platia-gateway]

  nginx:
    # Nginx con el panel compilado (nginx/Dockerfile)
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 128m
    restart: unless-stopped
    networks: [edge_net]

networks:
  edge_net:
  data_net:
  # Nombre fijo: PLATIA la declara como externa en docker-compose.gateway.yml
  llm_net:
    name: platia_llm_net

volumes:
  mysql_data:
  redis_data:
