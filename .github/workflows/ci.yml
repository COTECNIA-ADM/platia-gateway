name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    # MySQL real para los tests de migraciones y restricciones (tests/test_models_db.py)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: platia_gateway
          MYSQL_USER: gateway
          MYSQL_PASSWORD: ci-pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql+pymysql://gateway:ci-pass@127.0.0.1:3306/platia_gateway
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Los servicios de GitHub no admiten argumentos de arranque: la opción que deja crear los
      # disparadores de la auditoría (ADR-013) se activa con root antes de los tests
      - name: Permitir disparadores sin SUPER en MySQL
        run: >-
          python -c "import pymysql; c = pymysql.connect(host='127.0.0.1', user='root', password='ci-root');
          c.cursor().execute('SET GLOBAL log_bin_trust_function_creators = 1')"
      # Revisión de estilo con la configuración común de ruff.toml
      - run: ruff check .
      # Cobertura medida en cada PR; falla si baja del mínimo
      - run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=85

  panel:
    # Panel de administración (G13b): tipos, pruebas de pantallas y compilación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  compose:
    # Levanta los 4 contenedores con un .env generado, comprueba que responden y prueba el contrato
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generar .env y validar docker-compose
        run: |
          python scripts/generate_env.py
          docker compose config -q
      - name: Levantar el gateway
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Las migraciones se aplicaron
        run: docker compose exec -T gateway alembic current | grep "(head)"
      - name: Comprobar /health a través de Nginx
        run: |
          curl -sf http://localhost:8090/health | grep '"status":"ok"'
          # /health/ready no se publica fuera
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/health/ready)" = "404"
      - name: Comprobar que MySQL y Redis responden desde el gateway
        run: |
          docker compose exec -T gateway python -c "import urllib.request, json; r = json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready')); print(r); assert r['status'] == 'ok'"
      # Los SDK oficiales, para probar el gateway como lo usará PLATIA (messages.stream)
      - name: Instalar los SDK de Anthropic y OpenAI
        run: pip install anthropic openai
      - name: Contrato de inferencia y streaming con un proveedor simulado (scripts/prueba_docker.sh)
        run: bash scripts/prueba_docker.sh
      - name: La prueba se puede repetir
        run: bash scripts/prueba_docker.sh
      # Producción (G15): las mismas imágenes con docker-compose.prod.yml, HTTPS con un
      # certificado autofirmado, configuración insegura rechazada, copia y restauración
      - name: Configuración de producción (scripts/prueba_produccion.sh)
        run: bash scripts/prueba_produccion.sh
      - name: Logs de los contenedores
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --no-color --tail=200 || docker compose logs --no-color --tail=200
