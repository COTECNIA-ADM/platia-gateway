# Ajustes comunes de Nginx (G15, ADR-019): se incluye al principio de nginx.conf (desarrollo)
# y de prod.conf.template (producción), en el contexto http. Adaptado de
# machinebooks.ai/ES/aigateway/cap-33/block-09, block-11 y block-14 (MIT).

server_tokens off;
client_max_body_size 10m;
client_body_buffer_size 128k;
large_client_header_buffers 4 16k;

# Contra conexiones lentas a propósito (slowloris). La lectura del cuerpo y las cabeceras
# tiene plazo; send_timeout es entre dos escrituras, así que no corta un streaming largo
client_header_timeout 10s;
client_body_timeout 30s;
send_timeout 60s;
# keepalive_timeout: el de la imagen oficial (65 s)
keepalive_requests 1000;

# Correlación de extremo a extremo: se respeta el X-Request-ID del cliente (PLATIA manda el
# suyo); si no llega, el de Nginx. El gateway vuelve a validar su forma.
map $http_x_request_id $platia_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# DNS interno de Docker: resolver en cada petición evita 502 si el contenedor cambia de IP
resolver 127.0.0.11 valid=10s ipv6=off;

# Límites por dirección IP: frenan una avalancha o un abuso antes de llegar al gateway, que
# tiene sus propias cuotas por aplicación y persona (ADR-011). Holgados a propósito: una
# oficina entera puede salir por una sola dirección.
limit_req_zone $binary_remote_addr zone=platia_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=platia_cuenta:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=platia_api:10m rate=600r/m;
limit_conn_zone $binary_remote_addr zone=platia_conn:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;

# Registro de accesos en JSON y sin datos personales: la dirección sin su último octeto
# (IPv4) o solo su prefijo (IPv6), la ruta sin la consulta (puede llevar una persona o un
# filtro) y sin el navegador. Nunca cabeceras: ahí van las claves y los tokens.
map $remote_addr $platia_ip_anonima {
    "~^(?P<red>\d+\.\d+\.\d+)\.\d+$" "${red}.0";
    "~^(?P<red>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" "${red}::";
    default "-";
}
log_format platia_json escape=json
    '{"time":"$time_iso8601","ip":"$platia_ip_anonima","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","request_id":"$platia_request_id"}';
# El access_log va en cada server (locations.conf): así sustituye al de la imagen, que
# guarda la consulta y el navegador
