# Rutas que publica el gateway (G0–G14), comunes a desarrollo (nginx.conf) y producción
# (prod.conf.template). Lo que no está aquí no se publica. Se incluye dentro de un `server`
# que define $gateway_upstream y $hsts (vacía en desarrollo: sin HTTPS no se envía).

access_log /var/log/nginx/access.log platia_json;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security $hsts always;

# Límite de Nginx superado: error en JSON con la forma de los dos contratos (ADR-002)
error_page 429 = @demasiadas;
location @demasiadas {
    default_type application/json;
    add_header Retry-After 10 always;
    add_header Strict-Transport-Security $hsts always;
    return 429 '{"type":"error","error":{"type":"rate_limit_error","message":"Demasiadas peticiones desde esta dirección; espera unos segundos"}}';
}

location = /health {
    proxy_pass $gateway_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $platia_request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Contrato de inferencia (ADR-002). Rutas exactas: lo que no está aquí no se publica.
# Lectura larga: una respuesta sin streaming de un modelo con razonamiento tarda minutos
# (el gateway corta antes, con PROVIDER_TIMEOUT_SECONDS).
location ~ ^/v1/(messages|chat/completions|models)$ {
    limit_req zone=platia_api burst=100 nodelay;
    limit_conn platia_conn 100;
    proxy_pass $gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $platia_request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 330s;
    proxy_send_timeout 60s;
    # Streaming (G4): cada evento SSE sale en cuanto llega, sin acumularlo
    proxy_buffering off;
    proxy_cache off;
}

# Inicio de sesión: límite propio por dirección, además del bloqueo por persona del gateway
location ~ ^/auth/login(/mfa)?$ {
    limit_req zone=platia_login burst=20 nodelay;
    proxy_pass $gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $platia_request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Sesión y cuenta de las personas (G10, ADR-014): las usarán el panel y el portal.
# X-Real-IP: el gateway cuenta los intentos fallidos por dirección
location ~ ^/(auth|me)/ {
    limit_req zone=platia_cuenta burst=50 nodelay;
    proxy_pass $gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $platia_request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# API del panel de administración (G13, ADR-017). X-Real-IP: queda en el registro de cambios
location ~ ^/admin/ {
    limit_req zone=platia_cuenta burst=50 nodelay;
    proxy_pass $gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $platia_request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # La exportación de la auditoría puede tardar
    proxy_read_timeout 120s;
    client_max_body_size 64k;
}

# Eventos en tiempo real para el panel (G12, ADR-016): WebSocket de larga duración.
# El token va en el subprotocolo, nunca en la URL (que queda en el log de acceso)
location = /events/stream {
    limit_conn platia_conn 100;
    proxy_pass $gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $platia_request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Sin eventos en este tiempo, Nginx corta; el panel se vuelve a conectar
    proxy_read_timeout 1h;
    proxy_buffering off;
}

# Panel de administración (G13b): ficheros estáticos de una aplicación React. Todo lo que
# no es un fichero vuelve a index.html (rutas del navegador). Política de contenido estricta:
# solo código y estilos propios, y conexiones al mismo origen (API y WebSocket)
location = /panel {
    return 301 /panel/;
}
location /panel/ {
    root /usr/share/nginx/html;
    try_files $uri /panel/index.html;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Los ficheros con huella en el nombre no cambian nunca
    location /panel/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }
}

# Portal de usuario (G14, ADR-018): el mismo build que el panel, con su propia página de
# entrada; el código y los estilos se sirven desde /panel/assets/. Misma política de contenido
location = /portal {
    return 301 /portal/;
}
location /portal/ {
    root /usr/share/nginx/html;
    try_files /panel/portal.html =404;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}

# Todo lo demás (incluidas /health/ready, /metrics y la documentación) no se publica
location / {
    default_type application/json;
    return 404 '{"error":"not_found"}';
}
