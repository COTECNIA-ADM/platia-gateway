# Proxy inverso: único servicio con puerto publicado.
# Publica /health y las tres rutas del contrato de inferencia (G3); nada más.
# El endurecimiento completo (TLS, zonas de rate limit, logs sin PII) llega en G15.

server_tokens off;
client_max_body_size 10m;

# Correlación de extremo a extremo: se respeta el X-Request-ID del cliente (PLATIA manda el
# suyo); si no llega, el de Nginx. El gateway vuelve a validar su forma.
map $http_x_request_id $platia_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# DNS interno de Docker: resolver en cada petición evita 502 si el contenedor cambia de IP
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    set $gateway_upstream http://gateway:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location = /health {
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $platia_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Contrato de inferencia (ADR-002). Rutas exactas: lo que no está aquí no se publica.
    # Lectura larga: una respuesta sin streaming de un modelo con razonamiento tarda minutos
    # (el gateway corta antes, con PROVIDER_TIMEOUT_SECONDS).
    location ~ ^/v1/(messages|chat/completions|models)$ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $platia_request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 330s;
        proxy_send_timeout 60s;
        # Streaming (G4): cada evento SSE sale en cuanto llega, sin acumularlo
        proxy_buffering off;
        proxy_cache off;
    }

    # Todo lo demás (incluida /health/ready y la documentación) no se publica
    location / {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }
}
