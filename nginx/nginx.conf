# Proxy inverso: único servicio con puerto publicado.
# G0 solo publica /health; el contrato de inferencia (/v1/) se abre en G3.
# El endurecimiento completo (TLS, zonas de rate limit, logs sin PII) llega en G15.

server_tokens off;
client_max_body_size 10m;

# DNS interno de Docker: resolver en cada petición evita 502 si el contenedor cambia de IP
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    set $gateway_upstream http://gateway:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location = /health {
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás (incluida /health/ready y la documentación) no se publica
    location / {
        default_type application/json;
        return 404 '{"error":"not_found"}';
    }
}
