# Proxy inverso en desarrollo: único servicio con puerto publicado, por HTTP.
# Las rutas que publica están en snippets/locations.conf y los ajustes comunes (límites,
# plazos y registro sin datos personales), en snippets/http.conf. En producción se usa
# prod.conf.template, con HTTPS (G15, docs/despliegue.md).

include /etc/nginx/snippets/http.conf;

server {
    listen 80;

    set $gateway_upstream http://gateway:8000;
    # Sin HTTPS no se pide HSTS (una cabecera vacía no se envía)
    set $hsts "";

    include /etc/nginx/snippets/locations.conf;
}
